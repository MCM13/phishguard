name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest SQLite + PostgreSQL, pip-audit, imagen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phishguard
          POSTGRES_PASSWORD: ci-solo-pruebas
          POSTGRES_DB: phishguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phishguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Instalar dependencias (lockfile con hashes)
        run: pip install --require-hashes -r requirements-dev.lock

      - name: pytest (SQLite)
        run: python -m pytest -v -p no:cacheprovider

      - name: pytest (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://phishguard:ci-solo-pruebas@localhost:5432/phishguard_test
        run: python -m pytest -v -p no:cacheprovider

      - name: pip-audit sobre requirements.lock
        run: |
          pip install pip-audit==2.10.1
          pip-audit --strict --require-hashes --disable-pip -r requirements.lock

      - name: Construir la imagen Docker
        run: docker build -t phishguard-backend:ci .

  frontend:
    name: Frontend (npm ci, audit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      # Las 2 moderadas de react-router-dom@6 son el riesgo aceptado RA-02
      # (docs/auditoria-p3.md, apartado 2.3); cualquier aviso alto o crítico falla.
      - name: npm audit (producción, bloquea en high)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  secrets:
    name: Secretos (gitleaks, historial completo)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar gitleaks y verificar checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}$" | sha256sum --check -
          tar -xzf "${tarball}" gitleaks

      - name: gitleaks
        run: ./gitleaks git . --redact --verbose --gitleaks-ignore-path .gitleaksignore
