# Blueprint de REFERENCIA para desplegar PhishGuard en Render.
# https://render.com/docs/blueprint-spec
#
# Este fichero NO se aplica solo: solo afecta al servicio si lo creas o
# sincronizas con "Apply Blueprint" / Infrastructure-as-Code. Si el backend
# se creó a mano en el panel, las variables de aquí (RATE_LIMIT_*,
# ANTHROPIC_MAX_*, TRUSTED_PROXY_HOPS, etc.) NO existen en el entorno
# hasta que las añadas tú en Environment; mientras tanto mandan los
# valores por defecto del código (.env.example / rate_limit.py / …).
#
# Ajusta nombres de servicio y URLs antes de aplicar el blueprint.

services:
  - type: web
    name: phishguard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      # Desactiva /docs, /redoc y /openapi.json
      - key: ENVIRONMENT
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MAX_PER_HOUR
        value: "10"
      - key: ANTHROPIC_MAX_PER_DAY
        value: "20"
      # Con Cloudflare delante del backend, preferir CF-Connecting-IP.
      # Sin Cloudflare, dejar false y usar TRUSTED_PROXY_HOPS.
      - key: TRUST_CF_CONNECTING_IP
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: RATE_LIMIT_ANALYZE
        value: 10/minute
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: URLSCAN_API_KEY
        sync: false
      # Token para consultar el historial; defínelo en el panel de Render
      - key: ADMIN_TOKEN
        sync: false
      # SQLite en /tmp (escribible). Para persistir entre redeploys, monta un
      # Persistent Disk en /var/data y usa: sqlite:////var/data/phishguard.db
      - key: DATABASE_URL
        value: sqlite:////tmp/phishguard.db
      # Sustituye por tu dominio real en el panel de Render (no uses URLs de ejemplo en producción)
      - key: FRONTEND_URL
        value: https://app.tu-dominio.com
      - key: ALLOWED_ORIGINS
        value: https://app.tu-dominio.com
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: phishguard-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    dockerCommand: ""
    envVars:
      - key: VITE_API_URL
        value: https://tu-servicio-backend.onrender.com
    buildCommand: ""
    # El build arg VITE_API_URL se pasa en el Dockerfile; en Render configura
    # también en Environment → Docker Build Args si usas el panel web.
